<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root {
    --bg: #0a0c10; --bg2: #141a2a; --ink: #f4f6fb; --ink2: #a7b0c2; --ink3: #6e788c; --line: rgba(255,255,255,0.055);
    --chip: rgba(255,255,255,0.06); --chip-line: rgba(255,255,255,0.12); --photo-fade: #0a0d14;
  }
  body.light {
    --bg: #eef0f3; --bg2: #e2e4e7; --ink: #10131a; --ink2: #4a5262; --ink3: #7a8292; --line: rgba(10,20,40,0.06);
    --chip: rgba(255,255,255,0.7); --chip-line: rgba(10,20,40,0.12);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1280px; height: 400px; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1100px 520px at 18% 0%, var(--bg2), var(--bg) 70%);
    color: var(--ink); position: relative;
  }
  .grid {
    position: absolute; inset: 0;
    background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: linear-gradient(90deg, #000 0%, #000 45%, transparent 75%);
  }
  .photo {
    position: absolute; right: 14px; top: -2px; width: 562px; height: 412px;
    background: url(robot-dark.jpg) center / contain no-repeat;
    mask-image: radial-gradient(farthest-side at 50% 52%, #000 62%, transparent 99%);
  }
  body.light .photo { background-image: url(robot-light.jpg); }
  .glow {
    position: absolute; right: 120px; top: 40px; width: 420px; height: 320px; border-radius: 50%;
    background: radial-gradient(closest-side, rgba(242,80,123,0.22), transparent);
    filter: blur(20px);
  }
  body.light .glow { display: none; }
  .text { position: absolute; left: 72px; top: 54px; width: 640px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 46px; height: 46px; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,0.25); }
  .brand b { font-size: 17px; font-weight: 700; letter-spacing: 0.32em; }
  .brand span { font-size: 13px; color: var(--ink3); letter-spacing: 0.08em; margin-left: 2px; }
  h1 { margin-top: 34px; font-size: 58px; line-height: 1.04; font-weight: 700; letter-spacing: -0.02em; }
  h1 em { font-style: normal; background: linear-gradient(90deg, #ff7a1a, #f2507b 55%, #b45cc6); -webkit-background-clip: text; color: transparent; }
  p { margin-top: 16px; font-size: 19px; line-height: 1.45; color: var(--ink2); width: 560px; }
  .chips { display: flex; gap: 10px; margin-top: 26px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 14px; border-radius: 16px; font-size: 14px; font-weight: 600;
    background: var(--chip); border: 1px solid var(--chip-line); color: var(--ink); }
  .chip i { width: 8px; height: 8px; border-radius: 50%; background: #19c3a0; box-shadow: 0 0 0 4px rgba(25,195,160,0.18); }
  .chip.soon { background: linear-gradient(90deg, rgba(255,122,26,0.16), rgba(242,80,123,0.16)); border-color: rgba(242,80,123,0.45); }
  .chip.soon i { background: #f2507b; box-shadow: 0 0 0 4px rgba(242,80,123,0.2); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="photo"></div>
  <div class="text">
    <div class="brand"><img src="avatar.png" alt=""><b>NIOMATIC</b></div>
    <h1>Robots, <em>designed by AI.</em></h1>
    <p>Robot Studio is one project for a robot's mechanics, electronics and code — designed by AI agents, ready for you to build.</p>
    <div class="chips">
      <span class="chip"><i></i>Robot Studio</span>
      <span class="chip soon"><i></i>Release soon</span>
    </div>
  </div>
  <script>if (location.search.includes('light')) document.body.classList.add('light');</script>
</body>
</html>
